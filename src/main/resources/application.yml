apikey:  # 외부 연동 API 키 모음
  safe: ISGUSHVA-ISGU-ISGU-ISGU-ISGUSHVA5T  # 생활안전정보 API
  apis: ${APIS_SERVICE_KEY:ChjssyLjxDfEDKqZ7MIj1vyj9qvN8cPzu6zF%2B2unYHoq9dWZh7yUqYrT4gTjUXrg2J3VAms3eb3RHX%2Fpt1XLUg%3D%3D}
  apis2: ${APIS_SERVICE_KEY_2:}  # 예비 키. 주 키 한도 소진 시 자동 전환. 값은 환경변수로만 주입
  its: 7f94df5228ec4eadb1fb9772aad72d70
  # ── 아파트 단지 좌표(지오코딩) ──────────────────────────────────────────────
  # 실거래 API 는 좌표를 주지 않아 주소를 좌표로 바꿔야 한다(단지 4.5만 개).
  # **값은 환경변수로만 주입한다** — 이 저장소는 public 이다.
  #   juso   : 행안부 도로명주소 좌표제공 API 승인키(1순위. 우리 코드를 그대로 조립해 보낸다)
  #   vworld : VWorld 오픈API 인증키(보조. 지번 문자열로 메운다. 없으면 1순위만 쓴다)
  # 키가 없으면 /estate/complex/geocode 가 "키 없음"만 답하고 아무것도 바꾸지 않는다.
  juso: ${JUSO_CONFM_KEY:}
  vworld: ${VWORLD_API_KEY:}
  # 브이월드 데이터 API 는 "사용 도메인"을 함께 보내야 한다 — 키를 발급할 때 적은 주소와 같아야 한다.
  vworld-domain: ${VWORLD_DOMAIN:http://localhost:4200}

estate:
  geocode:
    # 한 건 받고 쉬는 시간(ms). 공공 API 가 몰아치는 호출을 싫어한다.
    # 120ms(초당 8건)로 돌렸더니 행안부가 E0007(다량 요청)로 막아 **열에 일곱이 실패**했다.
    # 초당 3건 정도가 막히지 않는 선이다(2026-10-15 실측).
    delay-ms: ${ESTATE_GEOCODE_DELAY_MS:330}
